plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.florist'
    compileSdk 34
    dataBinding{
        enabled=true
    }
    buildFeatures{
        viewBinding true
    }

    defaultConfig {
        applicationId "com.example.florist"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8\
        }
}

dependencies {
    implementation 'com.cloudinary:cloudinary-android:2.5.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.activity:activity:1.8.0'
    implementation 'androidx.fragment:fragment:1.2.0'
    implementation 'com.github.zhihu:Matisse:v0.5.3-beta3'
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.5'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-dynamic-links:21.1.0'
    implementation 'com.google.firebase:firebase-analytics'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation platform('com.google.firebase:firebase-bom:32.2.0')
    implementation("com.google.firebase:firebase-auth-ktx")
    implementation 'com.google.firebase:firebase-auth'
    implementation("com.google.android.gms:play-services-auth:20.7.0")
    implementation 'com.google.firebase:firebase-storage'
    implementation("com.google.firebase:firebase-messaging:23.4.1")
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.27'
    implementation 'com.mapbox.maps:android:10.16.1'
    implementation 'com.mapbox.search:mapbox-search-android-ui:1.0.0-rc.6'
    implementation 'com.mapbox.search:mapbox-search-android:1.0.0-rc.6'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.github.yalantis:ucrop:2.2.11'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    implementation 'com.github.MKergall:osmbonuspack:6.9.0'
    implementation 'org.apache.commons:commons-lang3:3.8.1'
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.squareup.okhttp3:okhttp:4.7.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'
}

android {
    // ... konfigurasi android lainnya
    configurations.all {
        resolutionStrategy {
            // Memaksa semua modul Kotlin menggunakan versi 1.8.20
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.20'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.20'
            // Tambahkan juga jdk7 untuk antisipasi
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.20'
        }
    }
}